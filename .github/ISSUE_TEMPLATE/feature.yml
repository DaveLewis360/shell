name: Feature request
description: Suggest something for this fork
labels: [enhancement]
body:
    - type: markdown
      value: |
          ### Before you file

          If your idea is not specific to the **horizontal bar** or the other
          fork additions, it probably belongs
          [upstream](https://github.com/caelestia-dots/shell/issues) — that way
          everyone gets it, and this fork stays small.

          This fork deliberately keeps its divergence from upstream as small as
          possible, so features that could live upstream should.

    - type: textarea
      attributes:
          label: What would you like
      validations:
          required: true

    - type: textarea
      attributes:
          label: Why
          description: What problem does it solve?
      validations:
          required: true

    - type: dropdown
      attributes:
          label: Could this live upstream instead?
          options:
              - "No — it is specific to the horizontal bar"
              - "Maybe — I am not sure"
              - "Yes, but I am asking here first"
      validations:
          required: true
